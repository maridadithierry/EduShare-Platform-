---
# ---------- Firewall (UFW) ----------
- name: Install UFW and fail2ban
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
    state: present

- name: Deny all incoming traffic by default
  community.general.ufw:
    direction: incoming
    default: deny

- name: Allow all outgoing traffic by default
  community.general.ufw:
    direction: outgoing
    default: allow

# SSH is opened before UFW is enabled so the connection is never cut off
- name: Allow SSH from anywhere (rate-limited; the Azure NSG restricts sources)
  community.general.ufw:
    rule: limit
    port: "{{ ssh_port }}"
    proto: tcp
  when: ssh_allowed_cidrs | length == 0

- name: Allow SSH only from the listed networks
  community.general.ufw:
    rule: allow
    port: "{{ ssh_port }}"
    proto: tcp
    from_ip: "{{ item }}"
  loop: "{{ ssh_allowed_cidrs }}"

- name: Allow HTTP for the website
  community.general.ufw:
    rule: allow
    port: "{{ app_public_port }}"
    proto: tcp

- name: Enable UFW
  community.general.ufw:
    state: enabled

# ---------- SSH hardening ----------
- name: Harden the SSH server
  ansible.builtin.template:
    src: sshd-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-edushare-hardening.conf
    owner: root
    group: root
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

# ---------- fail2ban ----------
- name: Configure fail2ban to ban repeated SSH login failures
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Start fail2ban now and on every boot
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true
